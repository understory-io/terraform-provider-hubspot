name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs in the same workflow when release-please cuts a release: its tag is
  # pushed with GITHUB_TOKEN, which never triggers a new workflow run, so a
  # tag-only trigger left v2.0.0 without binaries. A tag pushed by hand still
  # builds through the tag trigger.
  goreleaser:
    needs: release-please
    if: >-
      always() && (startsWith(github.ref, 'refs/tags/v') ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      - name: Import GPG key
        if: env.GPG_PRIVATE_KEY != ''
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          # Skip signing when no GPG key is wired up yet. Drop --skip=sign
          # once GPG_PRIVATE_KEY/GPG_PASSPHRASE secrets are set.
          args: release --clean ${{ secrets.GPG_PRIVATE_KEY == '' && '--skip=sign' || '' }}
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to TFC private registry
        # Skipped when no GPG key was imported (no signed artifacts to upload).
        if: steps.import_gpg.outputs.fingerprint != ''
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: ./scripts/tfc-upload-version.sh
